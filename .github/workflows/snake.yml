name: Generate Advanced Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main # Automatically updates when you push to main

# Set the environment variable globally for the entire workflow to silence the warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Step 1: Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate the multi-format animations
      - name: Generate GitHub Contribution Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: DMadushanka
          outputs: |
            # 1. Standard 2D Grid Animations
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            
            # 2. Premium Custom Palette 2D Animation (Halloween/Orange theme)
            dist/github-snake-custom.svg?color_snake=#ff6b6b&color_dots=#ebedf0,#f9d5bb,#f3a683,#f19066,#cf6a32
            
            # 3. Heavyweight 3D Isometric Animation
            dist/ocean-3d.svg?color_snake=#38bdf8&color_dots=#ebedf0,#7dd3fc,#38bdf8,#0284c7,#0369a1&sky_color=#0f172a&theme=ocean
            
            # 4. A high-quality GIF version
            dist/github-snake.gif

      # Step 3: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
