name: Generate Python Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows manual run button click
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Clone the repository files into the runner machine
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # Step 2: Provision clean Python environment (Cache removed to fix the error)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install necessary web requests framework
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Step 4: Execute the script to query API and render the vector asset
      - name: Run Snake Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_snake.py

      # Step 5: Save files directly into the isolated storage branch
      - name: Deploy Output Assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
